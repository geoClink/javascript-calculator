<!DOCTYPE html>
<html lang="en">

<head>
    <title></title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>

<body>

    <div class="calculator">
        <div class="answer-screen">
        </div>

        <div class="key-pad">
            <div class="first-row">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operator">/</button>
            </div>
            <div class="second-row">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operator">-</button>
            </div>
            <div class="third-row">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operator">*</button>
            </div>
            <div class="fourth-row">
                <button>0</button>
                <button >.</button>
                <button class="equal">=</button>
                <button class="operator">+</button>
            </div>
            <div class="fifth-row">
                <button class="clear-button">Clear</button>
                <button class="back-button">Back</button>
            </div>
        </div>
        <div class="sixth-row">
                <button id="speak-button"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
  <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z" />
</svg>
</button>
            </div>
    </div>

    <footer>
    </footer>

    <script href="script" src="script.js"></script>
</body>



</html>
