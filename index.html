<!DOCTYPE html>
<html lang="en">

<head>
    <title></title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>

<body>

    <div class="calculator">
        <div class="answer-screen">
        </div>

        <div class="key-pad">
            <div class="first-row">
                <button>1</button>
                <button>2</button>
                <button>3</button>
                <button class="operator">/</button>
            </div>
            <div class="second-row">
                <button>4</button>
                <button>5</button>
                <button>6</button>
                <button class="operator">-</button>
            </div>
            <div class="third-row">
                <button>7</button>
                <button>8</button>
                <button>9</button>
                <button class="operator">*</button>
            </div>
            <div class="fourth-row">
                <button>0</button>
                <button >.</button>
                <button class="equal">=</button>
                <button class="operator">+</button>
            </div>
            <div class="fifth-row">
                <button class="clear-button">Clear</button>
                <button class="back-button">Back</button>
            </div>
        </div>
    </div>

    <footer>
    </footer>

    <script href="script" src="script.js"></script>
</body>



</html>
